services:
  postgres:
    image: postgres:15-alpine
    container_name: fraudpulse-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fraudpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fraudpulse}
      POSTGRES_DB: ${POSTGRES_DB:-fraudpulse}
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER}']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fraudpulse-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:4
    container_name: fraudpulse-adminer
    ports:
      - '8080:8080'
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data:
